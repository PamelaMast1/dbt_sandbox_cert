version: 2

sources:
  - name: raw
    description: Raw workout events.
    database: "{{ target.project }}"
    schema: sources
    config:
      enabled: true
      meta:
        source_system: Schemabike
        data_owner: pamela@schemanest.com
    quoting:
      database: true
      schema: true
      identifier: false
    tables:
      - name: rw_workout_data
        identifier: raw_workout_data  # actual name of the table
        description: One row per workout session
        loader: airflow
        config:
          enabled: "{{ var('schemanest_source_enabled', false) }}"
          event_time: workout_timestamp
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 30, period: day}
            filter: "INSERT_TIMESTAMP >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 2 DAY)"

          loaded_at_field: INSERT_TIMESTAMP
          meta:
            event_granularity: workout
            contains_pii: false
        columns:
          - name: workout_id
            description: "{{ doc('workout_id') }}"
          - name: workout_timestamp
            description: "{{ doc('workout_timestamp') }}"
          - name: length_minutes
            description: "{{ doc('length_minutes') }}"
          - name: class_title
            description: "{{ doc('class_title') }}"
          - name: total_output
            description: "{{ doc('total_output') }}"
          - name: avg_watts
            description: "Average power output in watts"
          - name: distance_km
            description: "Distance covered in kilometers"
          - name: calories_burned
            description: "Calories burned during the session"
          - name: avg_heartrate_bpm
            description: "Average heart rate in beats per minute"
          - name: fitness_discipline
            description: "Workout discipline (e.g., cycling, running)"
          - name: instructor
            description: "Instructor display name"
          - name: INSERT_TIMESTAMP
            description: "{{ doc('INSERT_TIMESTAMP') }}"
          - name: ROW_COUNT
            description: "Rows from source on that run"

  - name: raw_workout_files
    schema: external

    tables:
      - name: workout_events_ext

        external:
          location: "gs://schemanest-raw_exxxxxaaamp/workouts/*.parquet"
          file_format: parquet

        columns:
          - name: workout_id
            data_type: string
          - name: user_id
            data_type: string
          - name: workout_timestamp
            data_type: timestamp
        config:
          meta:
            granularity: event
            contains_pii: true
    config:
      meta:
        source_system: gcs
        ingestion_tool: cloud_storage